services:
  postgres-integration:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: veza
      POSTGRES_USER: veza_migrator
      POSTGRES_PASSWORD: veza_migrator
      VEZA_APP_PASSWORD: veza_app
      VEZA_CONTROL_PASSWORD: veza_control
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veza_migrator -d veza"]
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data
