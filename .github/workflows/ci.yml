name: quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Source, contracts and production builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  database-integration:
    name: PostgreSQL identities, RLS and institution invariants
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: veza_bootstrap
          POSTGRES_PASSWORD: veza_bootstrap
          POSTGRES_DB: veza
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U veza_bootstrap -d veza"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      BOOTSTRAP_DATABASE_URL: postgresql://veza_bootstrap:veza_bootstrap@localhost:5432/veza
      MIGRATION_DATABASE_URL: postgresql://veza_migrator:veza_migrator@localhost:5432/veza
      DATABASE_URL: postgresql://veza_app:veza_app@localhost:5432/veza
      CONTROL_PLANE_DATABASE_URL: postgresql://veza_control:veza_control@localhost:5432/veza
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm --filter @veza/api db:bootstrap:test
      - run: pnpm --filter @veza/api db:migrate
      - run: pnpm --filter @veza/api test:integration
