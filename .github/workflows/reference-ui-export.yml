name: Export UI references

on:
  push:
    branches:
      - agent/design-system-ux
    paths:
      - .github/workflows/reference-ui-export.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package approved reference screens
        uses: actions/upload-artifact@v4
        with:
          name: veza-ui-references
          if-no-files-found: error
          retention-days: 1
          path: |
            Brand CI.png
            overview.png
            courses.png
            my-learning.png
            assessments.png
            analytics.png
            calender.png
