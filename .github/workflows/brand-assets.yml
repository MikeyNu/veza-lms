name: Generate Veza brand assets

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Brand CI.png"
      - "scripts/generate-brand-assets.mjs"
      - ".github/workflows/brand-assets.yml"

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate transparent PNG variants
        run: node scripts/generate-brand-assets.mjs

      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/public/branding apps/web/public/favicon.ico
          if git diff --cached --quiet; then
            echo "Brand assets are already current."
            exit 0
          fi
          git commit -m "Generate approved Veza PNG brand assets"
          git push
