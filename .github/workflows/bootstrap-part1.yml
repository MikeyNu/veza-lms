name: Bootstrap foundation part 1
on:
  push:
    branches: [agent/platform-foundation]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/platform-foundation
      - name: Apply workspace foundation
        shell: bash
        run: |
          echo '' | base64 --decode > /tmp/part.tgz
          tar -xzf /tmp/part.tgz
          rm -f .github/workflows/bootstrap-part1.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: establish workspace and architecture guardrails'
          git push origin HEAD:agent/platform-foundation
