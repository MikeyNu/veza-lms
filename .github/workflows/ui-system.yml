name: Shared UI system

on:
  pull_request:
    paths:
      - "packages/ui/**"
      - "apps/web/app/globals.css"
      - "apps/web/app/design-system/**"
      - "apps/web/app/learning/**"
      - "apps/web/app/assessments/**"
      - "apps/web/app/insights/**"
      - "apps/web/src/components/**"
      - "apps/web/src/features/dashboard/**"
      - "apps/web/src/features/design-system/**"
      - "apps/web/src/features/learner/**"
      - "apps/web/src/features/workspace/navigation.ts"
      - "apps/web/styles/**"
      - "apps/web/tests/**"
      - "apps/control-plane/app/globals.css"
      - "docs/design/**"
      - "docs/design-system/**"
      - ".github/workflows/ui-system.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-system-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24.18.0
  PNPM_VERSION: 11.15.1

jobs:
  contracts:
    name: UI components, semantics and production builds
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @veza/ui typecheck
      - run: pnpm --filter @veza/ui test
      - run: node --test apps/web/tests/ui-ux-contracts.test.mjs
      - run: pnpm --filter @veza/ui build
      - run: pnpm --filter @veza/web build
      - run: pnpm --filter @veza/control-plane build

  visual-regression:
    name: Shared UI desktop and mobile visual baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: packages/ui/tests/visual-requirements.txt
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install --requirement packages/ui/tests/visual-requirements.txt
      - run: pnpm --filter @veza/ui test:visual
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: shared-ui-visual-${{ github.sha }}
          path: packages/ui/tests/artifacts
          if-no-files-found: ignore
          retention-days: 14
