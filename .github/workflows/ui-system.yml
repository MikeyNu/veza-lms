name: Shared UI system

on:
  pull_request:
    paths:
      - "packages/ui/**"
      - "apps/web/app/design-system/**"
      - "apps/web/src/features/design-system/**"
      - "apps/web/styles/design-system-catalogue.css"
      - "apps/web/app/globals.css"
      - "apps/control-plane/app/globals.css"
      - "docs/design-system/**"
      - ".github/workflows/ui-system.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-system-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Components, accessibility and builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @veza/ui typecheck
      - run: pnpm --filter @veza/ui test
      - run: pnpm --filter @veza/ui build
      - run: pnpm --filter @veza/web build
      - run: pnpm --filter @veza/control-plane build

  visual-regression:
    name: Desktop and mobile visual regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install --requirement packages/ui/tests/visual-requirements.txt
      - run: pnpm --filter @veza/ui test:visual
