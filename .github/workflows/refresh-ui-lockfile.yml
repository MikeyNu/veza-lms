name: Refresh UI dependency lockfile

on:
  push:
    branches:
      - main
    paths:
      - "packages/ui/package.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-ui-lockfile
  cancel-in-progress: true

jobs:
  refresh:
    name: Regenerate pnpm lockfile
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 11.15.1
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit lockfile when changed
        shell: bash
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "Refresh UI dependency lockfile"
          git push
