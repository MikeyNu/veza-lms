services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: veza_bootstrap
      POSTGRES_PASSWORD: veza_bootstrap
      POSTGRES_DB: veza
    ports: ["5432:5432"]
    volumes:
      - veza-postgres:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veza_bootstrap -d veza"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:8-alpine
    ports: ["6379:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  veza-postgres:
